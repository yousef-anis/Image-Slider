<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <link rel="shortcut icon" href="/images/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <h1>Image Slider With Thumbnails</h1>
    <div class="slider-container">
      <button class="prev">
        <i class="fa-sharp-duotone fa-solid fa-angles-left fa-fade fa-xl"></i>
      </button>
      <div class="slider">
        <div class="img-id">Image 1 of 7</div>
        <img class="active" src="images/1.jpg" alt="Image 1" />
        <img src="images/2.jpg" alt="Image 2" />
        <img src="images/3.jpg" alt="Image 3" />
        <img src="images/4.jpg" alt="Image 4" />
        <img src="images/5.jpg" alt="Image 5" />
        <img src="images/6.jpg" alt="Image 6" />
        <img src="images/7.jpg" alt="Image 7" />
      </div>
      <button class="next">
        <i class="fa-sharp-duotone fa-solid fa-angles-right fa-fade fa-xl"></i>
      </button>
    </div>
    <div class="thumbnails-container"></div>

    <script src="main.js"></script>
  </body>
</html>
